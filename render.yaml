services:
    - type: web
      name: sportzy-backend
      env: python
      rootDir: backend
      buildCommand: pip install -r requirements.txt
      startCommand: python managee.py runserver 0.0.0.0:10000

    - type: web
      name: sportzy-frontend
      env: node
      rootDir: frontend
      buildCommand: npm install && npm run build
      startCommand: npm run preview -- --host 0.0.0.0 --post 10000

